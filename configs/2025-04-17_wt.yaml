# Configuration for manual curation of MS2 spots

# Experiment metadata
experiment:
  name: "wt"
  date: "2025-04-17"

# Data paths
data:
  # Path to the OME-Zarr file containing both MCP and H2B channels
  raw_data: "/hpc/projects/group.royer/people/bruno.moretti/data/epfl/2025-04-17/20250417_142938_Experiment/stabilized.zarr"

  # Path to segmentation
  segments: "/hpc/projects/group.royer/people/bruno.moretti/data/epfl/2025-04-17/20250417_142938_Experiment/tracking_original/results/segments.zarr"

  # Path to tracks CSV
  tracks: "/hpc/projects/group.royer/people/bruno.moretti/data/epfl/2025-04-17/20250417_142938_Experiment/tracking_original/results/tracks.csv"

  # Path to automatic spots (optional - for comparison/visualization)
  # Set to null to disable automatic spots loading
  spots: "/hpc/projects/group.royer/people/bruno.moretti/data/epfl/2025-04-17/20250417_142938_Experiment/spots/spots_filled.pkl"


# Output directory for curated points
output:
  directory: "/hpc/projects/group.royer/people/bruno.moretti/data/epfl/2025-04-17/20250417_142938_Experiment/spots/manual_curation_tests"

# Curation settings
curation:
  # Padding around nucleus bounding box (z, y, x) in pixels
  # Current values: ~17 µm in z, ~26 µm in x-y at 0.347 µm/pixel
  crop_padding:
    z: 50
    y: 75
    x: 75

  # Preload data into memory for faster scrolling?
  # true = load entire crop into RAM (fast scrolling, uses memory)
  # false = lazy loading from disk (slower scrolling, less memory)
  preload_to_memory: false

  # Show automatic spots in napari for comparison?
  show_auto_spots: true

  # Live intensity quantification: show intensity vs time plot in napari
  # Requires zms2 package (set zms2_path below if not on PYTHONPATH)
  live_quantification: true

  # Channel containing the spot signal (0=H2B, 1=MCP)
  spot_channel: 1

# Optional: path to zms2 package (if not already on PYTHONPATH)
zms2_path: "/hpc/projects/group.royer/people/bruno.moretti/code/zms2"

# Plotting settings (used by plot_manual_traces.py)
plotting:
  manual_spots_quantified: "/hpc/projects/group.royer/people/bruno.moretti/data/epfl/2025-04-17/20250417_142938_Experiment/spots/manual_spots_quantified.csv"
  output_manual_traces: "/hpc/projects/group.royer/people/bruno.moretti/data/epfl/2025-04-17/20250417_142938_Experiment/spots/manual_traces_norm.pdf"
  intensity_method: "gauss3d_dog"
  overlay_traces: false
  compare_auto: true
  xlim: null
  normalize: true
